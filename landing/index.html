      padding: 0 0 48px;
    }
    .kt-ascii-w2 {
      animation: kt-float 3.5s ease-in-out alternate infinite;
      will-change: transform;
    }
    .kt-ascii-text {
      font-family: monospace;
      white-space: pre;
      margin: 0;
      color: #3B82F6;
      font-size: 8px;
      line-height: 1.1;
      animation: kt-glow 3.5s ease-in-out alternate infinite;
    }
    @keyframes kt-float {
      0%,
      100% {
        translate: 0 0;
      }
      50% {
        translate: 0 -12px;
      }
    }
    @keyframes kt-glow {
      0%,
      100% {
        text-shadow: 0 0 4px currentColor, 0 0 10px currentColor;
      }
